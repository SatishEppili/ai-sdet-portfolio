name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    name: UI + API tests (self-hosted Toolshop)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Tests run against a Toolshop started in Docker on the runner: hermetic, freshly
      # seeded every run, and no Cloudflare bot check or shared-data surprises.
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
    steps:
      - uses: actions/checkout@v5

      # Pull images in the background while Node and the browser install.
      - name: Pull Toolshop images
        run: docker compose -f docker/toolshop.compose.yml pull --quiet &

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium

      - name: Start and seed Toolshop
        run: bash scripts/toolshop-up.sh

      - name: Run Playwright tests
        run: npx playwright test

      - name: Toolshop logs (on failure)
        if: failure()
        run: docker compose -f docker/toolshop.compose.yml logs --tail=200

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      # Project 2 adds an "AI failure triage" step here that reads test-results/results.json
