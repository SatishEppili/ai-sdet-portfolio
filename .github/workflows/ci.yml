name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # sticky triage comment on PRs

jobs:
  e2e:
    name: UI + API tests (self-hosted Toolshop)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Tests run against a Toolshop started in Docker on the runner: hermetic, freshly
      # seeded every run, and no Cloudflare bot check or shared-data surprises.
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history: triage diffs the PR against its base

      # Pull images in the background while Node and the browser install.
      - name: Pull Toolshop images
        run: docker compose -f docker/toolshop.compose.yml pull --quiet --ignore-buildable &

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium

      - name: Start and seed Toolshop
        run: bash scripts/toolshop-up.sh

      - name: Run Playwright tests
        id: tests
        env:
          # Self-healing asks an LLM only for ambiguous matches; without a key it refuses those.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ secrets.GROQ_API_KEY != '' && 'groq' || 'none' }}
        run: npx playwright test

      # Runs whenever the tests ran (also catches flaky tests on a green run).
      # Uses Groq if the GROQ_API_KEY secret is set, otherwise signals-only heuristics.
      - name: AI failure triage
        id: triage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ secrets.GROQ_API_KEY != '' && 'groq' || 'none' }}
          # What changed: the PR's base commit, or the previous commit on a push.
          TRIAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run triage -- --out triage-report.md

      # Tests that passed only because a locator self-healed: turn each heal into a code fix.
      - name: Self-healing report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: npm run heal:report -- --out heal-report.md

      - name: Comment triage on the PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.triage.outputs.failures != '' && steps.triage.outputs.failures != '0' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ai-failure-triage
          path: triage-report.md

      - name: Toolshop logs (on failure)
        if: failure()
        run: docker compose -f docker/toolshop.compose.yml logs --tail=200

      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            triage-report.*
            heal-report.md
          retention-days: 14
